<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threads Radio - 읽어주는 쓰레드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-bar {
      0%, 100% { height: 4px; }
      50% { height: 28px; }
    }
    .playing .bar { animation: pulse-bar 1.2s ease-in-out infinite; }
    .bar:nth-child(2) { animation-delay: 0.15s; }
    .bar:nth-child(3) { animation-delay: 0.3s; }
    .bar:nth-child(4) { animation-delay: 0.45s; }
    .bar:nth-child(5) { animation-delay: 0.6s; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen flex flex-col font-sans selection:bg-amber-500 selection:text-black">

  <!-- Header -->
  <header class="border-b border-neutral-800 px-6 py-4 flex justify-between items-center bg-neutral-900/60 backdrop-blur-md sticky top-0 z-30">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center text-white shadow-lg shadow-amber-500/20">
        <i class="fa-solid fa-radio text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight">Threads Radio</h1>
        <p class="text-xs text-neutral-400">귀로 듣는 쓰레드 이야기</p>
      </div>
    </div>
    <div class="flex items-center space-x-4">
      <div id="onAirBadge" class="hidden items-center space-x-1.5 px-3 py-1 bg-red-950/80 border border-red-600/50 rounded-full text-red-400 text-xs font-semibold animate-pulse">
        <span class="w-2 h-2 rounded-full bg-red-500"></span>
        <span>ON AIR</span>
      </div>
      <button onclick="toggleModal(true)" class="text-xs bg-neutral-800 hover:bg-neutral-700 px-3 py-1.5 rounded-lg border border-neutral-700 transition">
        <i class="fa-solid fa-plus mr-1"></i> 쓰레드 추가
      </button>
    </div>
  </header>

  <!-- Main Player Container -->
  <main class="flex-1 max-w-2xl w-full mx-auto p-6 flex flex-col justify-center">
    
    <!-- Radio Tuner / Card Box -->
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
      <!-- Background Ambient Glow -->
      <div class="absolute -top-20 -right-20 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <!-- DJ Status Bar -->
      <div class="flex items-center justify-between border-b border-neutral-800/80 pb-4 mb-6">
        <div class="flex items-center space-x-2 text-xs text-amber-400 font-mono">
          <i class="fa-solid fa-microphone-lines animate-pulse"></i>
          <span id="djStatus">DJ 대기 중...</span>
        </div>
        <!-- Visualizer -->
        <div id="visualizer" class="flex items-end space-x-1 h-7">
          <div class="bar w-1 bg-amber-500/80 rounded-full h-1"></div>
          <div class="bar w-1 bg-amber-500/80 rounded-full h-1"></div>
          <div class="bar w-1 bg-amber-500/80 rounded-full h-1"></div>
          <div class="bar w-1 bg-amber-500/80 rounded-full h-1"></div>
          <div class="bar w-1 bg-amber-500/80 rounded-full h-1"></div>
        </div>
      </div>

      <!-- Post Content View -->
      <div class="min-h-[160px] flex flex-col justify-center">
        <div class="flex items-center space-x-3 mb-4">
          <div class="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center font-bold text-amber-400 text-sm border border-neutral-700" id="authorAvatar">
            @
          </div>
          <div>
            <div class="font-semibold text-sm text-neutral-200" id="authorName">김감성</div>
            <div class="text-xs text-neutral-500" id="authorHandle">@sensibility_kim</div>
          </div>
          <span class="text-xs text-neutral-600 ml-auto" id="threadTime">방금 전</span>
        </div>

        <p id="threadBody" class="text-neutral-300 text-lg leading-relaxed font-light transition-all">
          재생 버튼을 누르면 쓰레드 글을 라디오 DJ처럼 편안한 목소리와 배경음악과 함께 낭독해 드립니다.
        </p>
      </div>

      <!-- Player Controls -->
      <div class="mt-8 pt-6 border-t border-neutral-800/80 flex flex-col sm:flex-row items-center justify-between gap-4">
        
        <!-- Action Buttons -->
        <div class="flex items-center space-x-3">
          <button onclick="prevThread()" class="w-10 h-10 rounded-full hover:bg-neutral-800 flex items-center justify-center text-neutral-400 hover:text-white transition">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          
          <button id="playBtn" onclick="togglePlay()" class="w-14 h-14 rounded-full bg-amber-500 hover:bg-amber-400 text-black flex items-center justify-center shadow-lg shadow-amber-500/20 transition transform active:scale-95">
            <i id="playIcon" class="fa-solid fa-play text-xl ml-0.5"></i>
          </button>

          <button onclick="nextThread()" class="w-10 h-10 rounded-full hover:bg-neutral-800 flex items-center justify-center text-neutral-400 hover:text-white transition">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>

        <!-- BGM & Voice Options -->
        <div class="flex items-center space-x-4 text-xs text-neutral-400">
          <label class="flex items-center space-x-2 cursor-pointer select-none">
            <input type="checkbox" id="bgmToggle" checked onchange="toggleBgm(this.checked)" class="accent-amber-500 rounded">
            <span>라디오 BGM</span>
          </label>

          <div class="flex items-center space-x-1">
            <i class="fa-solid fa-gauge-high"></i>
            <select id="rateSelect" class="bg-neutral-800 border border-neutral-700 rounded px-2 py-1 text-neutral-200 outline-none">
              <option value="0.9">0.9x (느긋하게)</option>
              <option value="1.0" selected>1.0x (보통)</option>
              <option value="1.15">1.15x (약간 빠르게)</option>
            </select>
          </div>
        </div>

      </div>
    </div>

    <!-- Playlist Preview -->
    <div class="mt-6">
      <div class="flex justify-between items-center mb-3 px-1">
        <span class="text-xs uppercase tracking-wider text-neutral-500 font-semibold">오늘의 방송 사연 목록 (<span id="playlistCount">0</span>)</span>
      </div>
      <div id="playlist" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
    </div>

  </main>

  <!-- Add Thread Modal -->
  <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-md p-6">
      <h3 class="text-base font-bold mb-4">새 쓰레드 사연 추가</h3>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-neutral-400">작성자</label>
          <input type="text" id="newAuthor" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2.5 text-sm mt-1 focus:border-amber-500 outline-none" placeholder="예: 밤하늘별">
        </div>
        <div>
          <label class="text-xs text-neutral-400">내용</label>
          <textarea id="newContent" rows="4" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2.5 text-sm mt-1 focus:border-amber-500 outline-none" placeholder="쓰레드 본문을 입력하세요..."></textarea>
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-5">
        <button onclick="toggleModal(false)" class="px-4 py-2 text-xs rounded-lg bg-neutral-800 hover:bg-neutral-700 text-neutral-300">취소</button>
        <button onclick="addCustomThread()" class="px-4 py-2 text-xs rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-semibold">추가하기</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Initial Mock Threads Data
    let threads = [
      {
        author: "퇴근길직장인",
        handle: "@daily_routine",
        time: "10분 전",
        content: "오늘 유독 지치고 힘들었는데, 지하철에서 어떤 할머니께서 따뜻한 붕어빵을 건네주셨어요. 세상은 아직 살 만한 것 같아요."
      },
      {
        author: "새벽코더",
        handle: "@dev_night",
        time: "25분 전",
        content: "3시간 동안 잡고 있던 버그가 세미콜론 하나 때문이었다니. 허탈하지만 그래도 창밖의 새벽 공기가 참 상쾌하네요."
      },
      {
        author: "책읽는고양이",
        handle: "@cat_books",
        time: "40분 전",
        content: "남들과 비교하면서 조급해질 때마다 잠시 폰을 내려놓고 심호흡을 세 번 해보세요. 당신만의 계절은 반드시 옵니다."
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let synth = window.speechSynthesis;
    let currentUtterance = null;
    let audioCtx = null;
    let bgmGainNode = null;
    let bgmInterval = null;

    // DJ Openings for Radio Feel
    const djOpenings = [
      "다음으로 들려드릴 사연입니다.",
      "이번엔 쓰레드에서 많은 공감을 얻은 글이에요.",
      "익명의 쓰레더님이 전해주신 따뜻한 마음입니다.",
      "라디오 채널에 도착한 다음 이야기, 함께 나눠볼게요."
    ];

    // UI Updates
    function updateUI() {
      const cur = threads[currentIndex];
      document.getElementById('authorName').innerText = cur.author;
      document.getElementById('authorHandle').innerText = cur.handle;
      document.getElementById('authorAvatar').innerText = cur.author.charAt(0);
      document.getElementById('threadTime').innerText = cur.time;
      document.getElementById('threadBody').innerText = cur.content;
      document.getElementById('playlistCount').innerText = threads.length;

      // Render Playlist
      const listEl = document.getElementById('playlist');
      listEl.innerHTML = threads.map((t, idx) => `
        <div onclick="selectThread(${idx})" class="p-2.5 rounded-xl cursor-pointer text-xs flex items-center justify-between border transition ${
          idx === currentIndex ? 'bg-amber-500/10 border-amber-500/40 text-amber-300' : 'bg-neutral-900/50 border-neutral-800 hover:bg-neutral-800/50 text-neutral-400'
        }">
          <div class="truncate mr-3">
            <span class="font-semibold text-neutral-300 mr-2">${t.author}</span>
            <span>${t.content}</span>
          </div>
          ${idx === currentIndex && isPlaying ? '<i class="fa-solid fa-volume-high text-amber-400 text-xs"></i>' : ''}
        </div>
      `).join('');
    }

    // Web Audio API Ambient Radio BGM Generator (No external audio file needed)
    function initBgm() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        bgmGainNode = audioCtx.createGain();
        bgmGainNode.gain.setValueAtTime(0.08, audioCtx.currentTime); // Subtle volume
        bgmGainNode.connect(audioCtx.destination);
      }
    }

    function playLoFiChord() {
      if (!audioCtx || !document.getElementById('bgmToggle').checked || !isPlaying) return;
      const chords = [
        [261.63, 329.63, 392.00, 493.88], // Cmaj7
        [220.00, 261.63, 329.63, 392.00], // Am7
        [174.61, 220.00, 261.63, 329.63], // Fmaj7
        [196.00, 246.94, 293.66, 349.23]  // G7
      ];
      const chord = chords[Math.floor(Math.random() * chords.length)];
      
      chord.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, audioCtx.currentTime); // Warm vintage tone

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.02, audioCtx.currentTime + 1.2);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(bgmGainNode);

        osc.start();
        osc.stop(audioCtx.currentTime + 5.0);
      });
    }

    function startBgm() {
      initBgm();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      playLoFiChord();
      if (!bgmInterval) {
        bgmInterval = setInterval(playLoFiChord, 4500);
      }
    }

    function stopBgm() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    // TTS & Radio Flow
    function playCurrentThread() {
      synth.cancel();
      const current = threads[currentIndex];
      const opening = djOpenings[Math.floor(Math.random() * djOpenings.length)];
      const fullText = `${opening}. ${current.author}님의 글입니다. ... ${current.content}`;

      currentUtterance = new SpeechSynthesisUtterance(fullText);
      currentUtterance.lang = 'ko-KR';
      currentUtterance.rate = parseFloat(document.getElementById('rateSelect').value);
      currentUtterance.pitch = 1.0;

      // Select better Korean voice if available
      const voices = synth.getVoices();
      const koVoice = voices.find(v => v.lang.includes('ko') || v.lang.includes('KR'));
      if (koVoice) currentUtterance.voice = koVoice;

      document.getElementById('djStatus').innerText = `DJ 낭독 중: @${current.author}`;
      document.getElementById('visualizer').classList.add('playing');
      document.getElementById('onAirBadge').classList.remove('hidden');
      document.getElementById('onAirBadge').classList.add('flex');

      currentUtterance.onend = () => {
        if (!isPlaying) return;
        document.getElementById('djStatus').innerText = "잠시 음악이 흐릅니다...";
        document.getElementById('visualizer').classList.remove('playing');
        
        // Intermission pause (like real radio) before the next thread
        setTimeout(() => {
          if (isPlaying) {
            nextThread();
          }
        }, 2200);
      };

      currentUtterance.onerror = () => {
        setPlayingState(false);
      };

      synth.speak(currentUtterance);
    }

    function setPlayingState(play) {
      isPlaying = play;
      const playIcon = document.getElementById('playIcon');
      if (isPlaying) {
        playIcon.className = "fa-solid fa-pause text-xl";
        startBgm();
        playCurrentThread();
      } else {
        playIcon.className = "fa-solid fa-play text-xl ml-0.5";
        synth.cancel();
        stopBgm();
        document.getElementById('djStatus').innerText = "라디오 일시정지";
        document.getElementById('visualizer').classList.remove('playing');
        document.getElementById('onAirBadge').classList.add('hidden');
        document.getElementById('onAirBadge').classList.remove('flex');
      }
      updateUI();
    }

    function togglePlay() {
      setPlayingState(!isPlaying);
    }

    function nextThread() {
      currentIndex = (currentIndex + 1) % threads.length;
      updateUI();
      if (isPlaying) playCurrentThread();
    }

    function prevThread() {
      currentIndex = (currentIndex - 1 + threads.length) % threads.length;
      updateUI();
      if (isPlaying) playCurrentThread();
    }

    function selectThread(idx) {
      currentIndex = idx;
      updateUI();
      if (isPlaying) playCurrentThread();
    }

    function toggleBgm(enabled) {
      if (enabled && isPlaying) startBgm();
      else stopBgm();
    }

    // Custom Thread Modal Handlers
    function toggleModal(show) {
      const modal = document.getElementById('modal');
      if (show) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function addCustomThread() {
      const author = document.getElementById('newAuthor').value.trim() || '익명의 청취자';
      const content = document.getElementById('newContent').value.trim();
      if (!content) return alert('내용을 입력해 주세요.');

      threads.unshift({
        author,
        handle: `@${author}`,
        time: '방금 전',
        content
      });

      document.getElementById('newAuthor').value = '';
      document.getElementById('newContent').value = '';
      toggleModal(false);
      currentIndex = 0;
      updateUI();
      if (isPlaying) playCurrentThread();
    }

    // Voice loaded event for browsers that load voices asynchronously
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => { /* voices ready */ };
    }

    // Initialize
    updateUI();
  </script>
</body>
</html>
